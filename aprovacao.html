<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>NOVA Associates</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Página pública de aprovação de trabalhos a mais (co_form / co_decide). */
  :root {
    --bg: #F7F7F5; --surface: #FFFFFF; --border: #E4E3DE; --border-strong: #D3D1CA;
    --text: #1B1A19; --text-2: #6B6660; --accent: #714D79; --on-accent: #FFFFFF;
    --accent-soft: rgba(113, 77, 121, 0.09); --focus: 0 0 0 3px rgba(113, 77, 121, 0.25);
    --danger: #C4453D;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --surface: #18181B; --border: #27272C; --border-strong: #36363C;
      --text: #ECECEE; --text-2: #A0A0A8; --accent: #B797BE; --on-accent: #16121A;
      --accent-soft: rgba(183, 151, 190, 0.13); --focus: 0 0 0 3px rgba(183, 151, 190, 0.3);
      --danger: #E07A72;
    }
    .logo-light { display: none; }
    .logo-dark { display: block !important; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 40px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; }
  .logo { height: 26px; margin-bottom: 24px; }
  .logo-dark { display: none; }
  h1 { font-size: 21px; line-height: 1.3; margin: 0 0 8px; font-weight: 650; letter-spacing: -0.01em; }
  p { margin: 0 0 16px; color: var(--text-2); }
  .ta-head { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  .desc { white-space: pre-wrap; color: var(--text); margin: 0 0 18px; }
  .facts { border-top: 1px solid var(--border); margin: 0 0 18px; }
  .facts div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .facts span { color: var(--text-2); }
  .facts b { text-align: right; }
  .facts .total b { font-size: 20px; }
  .vat { font-size: 13px; color: var(--text-2); margin: -10px 0 18px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input, textarea { width: 100%; border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px; font: inherit; color: var(--text); background: var(--surface); }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, textarea:focus { outline: none; box-shadow: var(--focus); border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong); }
  .done { text-align: center; padding: 12px 0; }
  .done .mark { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; animation: pop .35s ease; }
  .done.no .mark { color: var(--text-2); }
  .err { color: var(--danger); font-size: 14px; margin-top: 10px; }
  .foot { text-align: center; font-size: 12px; color: var(--text-2); margin-top: 18px; }
  .card { position: relative; }
  .lang { position: absolute; top: 22px; right: 20px; display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .lang button { border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13px; font-weight: 600; padding: 6px 10px; cursor: pointer; min-height: 32px; }
  .lang button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (max-width: 420px) { .card { padding: 24px 16px; } .row { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="card" id="card" aria-live="polite">
    <img class="logo logo-light" src="assets/nova-logo-plum-cropped.png" alt="NOVA Associates">
    <img class="logo logo-dark" src="assets/nova-logo-white-cropped.png" alt="NOVA Associates">
    <div class="lang" id="lang" role="group" aria-label="Língua / Language" hidden><button type="button" data-l="pt" aria-pressed="true" lang="pt">PT</button><button type="button" data-l="en" aria-pressed="false" lang="en">EN</button></div>
    <div id="view"><p>…</p></div>
  </div>
  <div class="foot">NOVA Associates</div>
</main>
<script>
(() => {
  // Página pública de aprovação de trabalhos a mais: o cliente vê o pedido e aprova ou recusa, sem conta.
  // Só fala com a base de dados através de co_form / co_decide, com o código (t) do pedido.
  const SUPABASE_URL = 'https://syatogsavmrcgjcuydtu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5YXRvZ3Nhdm1yY2dqY3V5ZHR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMzc0NzEsImV4cCI6MjA5MDcxMzQ3MX0.Pcu3vfXKtbdqFWV0gv2b9ReHpwMErj40hbw_PgkFVBM';
  const token = (new URLSearchParams(location.search).get('t') || '').trim();
  const demo = token === 'exemplo';
  const view = document.getElementById('view');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const T = {
    pt: {
      bad: 'Este link não é válido ou já não está ativo.', err: 'Não foi possível guardar. Tente outra vez, por favor.',
      kicker: n => `Trabalho a mais · TA${String(n).padStart(2, '0')}`,
      project: 'Projeto', how: 'Cálculo', hours: (h, r) => `${fmtN(h)} h × ${eur(r)}/h`, fixed: 'Valor fixo',
      value: 'Valor', days: 'Prazo adicional', daysV: d => `${d} ${d === 1 ? 'dia útil' : 'dias úteis'}`, noDays: 'Sem alteração de prazo',
      vat: 'Acresce IVA à taxa legal em vigor.', name: 'O seu nome', note: 'Comentário', opt: '(opcional)',
      approve: 'Aprovar', reject: 'Recusar', sending: 'A enviar…', needName: 'Escreva o seu nome, por favor.',
      approved: 'Aprovado. Obrigado!', approvedSub: 'Registámos a sua aprovação. Vamos avançar e incluir este trabalho no projeto.',
      rejected: 'Registado.', rejectedSub: 'Registámos que não pretende avançar com este trabalho. Se quiser falar sobre ele, basta responder ao nosso email.',
      wasApproved: (w, d) => `Este pedido foi aprovado${w ? ' por ' + esc(w) : ''}${d ? ' a ' + d : ''}.`,
      wasRejected: (w, d) => `Este pedido foi recusado${w ? ' por ' + esc(w) : ''}${d ? ' a ' + d : ''}.`,
      cancelled: 'Este pedido foi cancelado pela NOVA.', demo: 'Exemplo: a resposta não é guardada.'
    },
    en: {
      bad: 'This link is not valid or is no longer active.', err: 'We could not save your answer. Please try again.',
      kicker: n => `Additional work · TA${String(n).padStart(2, '0')}`,
      project: 'Project', how: 'Basis', hours: (h, r) => `${fmtN(h)} h × ${eur(r)}/h`, fixed: 'Fixed fee',
      value: 'Amount', days: 'Additional time', daysV: d => `${d} working ${d === 1 ? 'day' : 'days'}`, noDays: 'No change to the schedule',
      vat: 'VAT added at the applicable legal rate.', name: 'Your name', note: 'Comment', opt: '(optional)',
      approve: 'Approve', reject: 'Decline', sending: 'Sending…', needName: 'Please write your name.',
      approved: 'Approved. Thank you!', approvedSub: 'We have recorded your approval and will include this work in the project.',
      rejected: 'Recorded.', rejectedSub: 'We have recorded that you do not wish to proceed with this work. If you would like to discuss it, simply reply to our email.',
      wasApproved: (w, d) => `This request was approved${w ? ' by ' + esc(w) : ''}${d ? ' on ' + d : ''}.`,
      wasRejected: (w, d) => `This request was declined${w ? ' by ' + esc(w) : ''}${d ? ' on ' + d : ''}.`,
      cancelled: 'This request was withdrawn by NOVA.', demo: 'Example: the answer is not saved.'
    }
  };
  let lang = 'pt', t = T.pt;
  const fmtN = v => new Intl.NumberFormat(lang === 'en' ? 'en-IE' : 'pt-PT', { maximumFractionDigits: 1 }).format(Number(v) || 0);
  const eur = v => new Intl.NumberFormat(lang === 'en' ? 'en-IE' : 'pt-PT', { style: 'currency', currency: 'EUR' }).format(Number(v) || 0);
  const day = iso => iso ? new Date(iso).toLocaleDateString(lang === 'en' ? 'en-GB' : 'pt-PT', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const setLang = l => { lang = l === 'en' ? 'en' : 'pt'; t = T[lang]; document.documentElement.lang = lang === 'en' ? 'en' : 'pt-PT'; document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang)); };
  const browserLang = (navigator.languages || [navigator.language || '']).map(x => String(x).toLowerCase());
  const pickLang = c => c === 'en' ? 'en' : browserLang.some(x => x.startsWith('pt')) ? 'pt' : browserLang.some(x => x.startsWith('en')) ? 'en' : 'pt';
  const check = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const cross = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const message = (title, sub, no) => { view.innerHTML = `<div class="done${no ? ' no' : ''}"><div class="mark">${no ? cross : check}</div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>`; };
  if (!token) { view.innerHTML = `<p>${T.pt.bad}</p>`; return; }
  const sb = demo || !window.supabase ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  const rpc = async (fn, args) => { if (!sb) throw new Error('offline'); const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };
  let form, state = 'form';
  function draw() {
    if (state === 'approved') return message(t.approved, t.approvedSub);
    if (state === 'rejected') return message(t.rejected, t.rejectedSub, true);
    if (form.status === 'approved') return message(t.wasApproved(form.decided_by, day(form.decided_at)));
    if (form.status === 'rejected') return message(t.wasRejected(form.decided_by, day(form.decided_at)), '', true);
    if (form.status === 'cancelled') return message(t.cancelled, '', true);
    const keepName = document.getElementById('nm')?.value || '', keepNote = document.getElementById('nt')?.value || '';
    view.innerHTML = `
      <div class="ta-head">${t.kicker(form.number)}</div>
      <h1>${esc(form.title)}</h1>
      ${form.description ? `<p class="desc">${esc(form.description)}</p>` : ''}
      <div class="facts">
        <div><span>${t.project}</span><b>${esc(form.project)}</b></div>
        <div><span>${t.how}</span><b>${form.pricing === 'hours' && form.est_hours && form.rate ? t.hours(form.est_hours, form.rate) : t.fixed}</b></div>
        <div><span>${t.days}</span><b>${Number(form.extra_days) ? t.daysV(Number(form.extra_days)) : t.noDays}</b></div>
        <div class="total"><span>${t.value}</span><b>${eur(form.value)}</b></div>
      </div>
      <p class="vat">${t.vat}</p>
      <label for="nm">${t.name}</label><input id="nm" autocomplete="name" maxlength="120" value="${esc(keepName)}">
      <label for="nt">${t.note} <span style="font-weight:400;color:var(--text-2)">${t.opt}</span></label><textarea id="nt" maxlength="1000">${esc(keepNote)}</textarea>
      <div class="row"><button class="btn ghost" id="no">${t.reject}</button><button class="btn" id="yes">${t.approve}</button></div>
      <div id="msg"></div>
      ${demo ? `<p style="margin-top:16px;font-size:13px">${t.demo}</p>` : ''}`;
    const go = async (decision, btn) => {
      const name = document.getElementById('nm').value.trim();
      if (!name) { document.getElementById('msg').innerHTML = `<div class="err">${t.needName}</div>`; document.getElementById('nm').focus(); return; }
      view.querySelectorAll('.btn').forEach(b => b.disabled = true); const label = btn.textContent; btn.textContent = t.sending;
      try {
        if (!demo) { const r = await rpc('co_decide', { p_token: token, p_decision: decision, p_name: name, p_note: document.getElementById('nt').value }); if (!r?.ok) throw new Error(r?.error || 'x'); }
        state = decision; draw();
      } catch { view.querySelectorAll('.btn').forEach(b => b.disabled = false); btn.textContent = label; document.getElementById('msg').innerHTML = `<div class="err">${t.err}</div>`; }
    };
    document.getElementById('yes').onclick = e => go('approved', e.target);
    document.getElementById('no').onclick = e => go('rejected', e.target);
  }
  (async () => {
    try {
      form = demo ? { ok: true, status: 'sent', number: 1, title: 'Alteração da cozinha para open space', description: 'Revisão das plantas do piso 0 e do projeto de execução da cozinha, a pedido do cliente.', pricing: 'hours', est_hours: 12, rate: 150, value: 1800, extra_days: 5, project: 'Projeto de exemplo', lang: 'pt' }
        : await rpc('co_form', { p_token: token });
    } catch { view.innerHTML = `<p>${T.pt.err}</p>`; return; }
    if (!form?.ok) { view.innerHTML = `<p>${T.pt.bad}</p>`; return; }
    setLang(pickLang(form.lang));
    const lb = document.getElementById('lang'); lb.hidden = false;
    lb.addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (!b || b.dataset.l === lang) return; setLang(b.dataset.l); draw(); });
    draw();
  })();
})();
</script>
</body>
</html>
