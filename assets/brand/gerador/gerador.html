<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script src="../nova-draw.js"></script>
<script>
// Fundos de ecrã (render) e imagens do LinkedIn (renderLI). O desenho da marca está em ../nova-draw.js.
const D = NOVA_DRAW, PAL = D.PAL;
// onde fica o logótipo em cada formato: centro (x,y) e largura, em fração
function spot(w, h, center) {
  const port = h > w * 1.2, sq = !port && h > w * 0.8;
  if (center) return port ? { x: .5, y: .5, lw: .40 } : sq ? { x: .5, y: .5, lw: .24 } : { x: .5, y: .5, lw: .15 };
  return port ? { x: .5, y: .80, lw: .22 } : sq ? { x: .5, y: .82, lw: .13 } : { x: .5, y: .84, lw: .072 };
}
const drawLogo = (g, w, h, s, color) => D.logo(g, s.x * w, s.y * h, s.lw * w, color);
function canvas(w, h) { const cv = document.getElementById('c'); cv.width = w; cv.height = h; return cv.getContext('2d'); }

window.render = (design, mode, w, h) => {
  const g = canvas(w, h), P = PAL[mode], port = h > w * 1.2;
  if (design === 'assinatura') {   // o fundo da marca: o NOVA ao centro, com a luz à volta
    const s = spot(w, h, true), fy = port ? .5 : .47;
    D.background(g, design, mode, w, h, { focus: { fx: .5, fy } });
    D.logo(g, w / 2, h * fy, s.lw * w * (port ? .85 : 1), P.ink);
    D.grain(g, w, h, 1.6, 7);
    return true;
  }
  if (design === 'monograma') {
    const nh = (port ? 1.05 : 1.25) * h, k = nh / 382;
    D.background(g, design, mode, w, h, { mono: { x: port ? w / 2 - 353 * k * 0.55 : w - 353 * k * 0.78, y: port ? h * 0.08 : h * 0.06, h: nh } });
  } else D.background(g, design, mode, w, h);
  if (design === 'essencial') drawLogo(g, w, h, spot(w, h, true), P.ink);
  else if (design === 'monograma') drawLogo(g, w, h, port || h > w * .8 ? spot(w, h) : { x: .12, y: .86, lw: .072 }, P.ink);
  else drawLogo(g, w, h, spot(w, h), P.ink);
  D.grain(g, w, h, design === 'luz' ? 5 : 3, { essencial: 7, monograma: 11, topografia: 13, luz: 17 }[design]);
  return true;
};

// ---------- LinkedIn ----------
// O fundo assinatura (o mesmo dos fundos de ecrã), em claro e escuro.
// kind: cover (página da empresa, 4200×700), life (separador Vida, 2256×752), personal (perfil de cada pessoa, 1584×396)
// O LinkedIn põe o logótipo da página / a fotografia de perfil por cima do canto inferior esquerdo da capa,
// e no telemóvel corta as pontas: o logótipo e a frase ficam no meio (página) ou à direita (perfil pessoal).
const TAGLINE = 'Creating Impact. Driving Returns. Building Legacy.';
window.renderLI = async (kind, design, mode, w, h) => {
  await document.fonts.load('500 40px Inter');
  const g = canvas(w, h), P = PAL[mode];
  // regras do logótipo: largura fixa por formato, frase a 4,6 % da largura do NOVA e a 1,6× o seu tamanho por baixo
  const cx = kind === 'personal' ? w * .74 : w * .5, cy = h * (kind === 'life' ? .5 : .46);
  const lw = kind === 'personal' ? w * .22 : kind === 'life' ? w * .2 : w * .16;
  const lh = lw * D.LH / D.LW, tag = kind !== 'life', ly = tag ? cy - lh * .35 : cy;
  D.background(g, 'assinatura', mode, w, h, { focus: { fx: cx / w, fy: ly / h } });
  D.logo(g, cx, ly, lw, P.ink);
  if (tag) {
    const fs = Math.round(lw * .046);
    g.font = `500 ${fs}px Inter`; g.fillStyle = P.soft; g.textAlign = 'center'; g.textBaseline = 'top';
    if ('letterSpacing' in g) g.letterSpacing = (fs * .04) + 'px';
    g.fillText(TAGLINE, cx, ly + lh / 2 + fs * 1.6);
  }
  D.grain(g, w, h, 1.6, 23);
  return true;
};
// Logótipo da página (quadrado): palavra NOVA ou o N, em fundo claro ou ameixa
window.renderLogo = (kind, bg, w) => {
  const g = canvas(w, w), plum = '#714D79', light = '#F4F3EF';
  g.fillStyle = bg === 'ameixa' ? plum : light; g.fillRect(0, 0, w, w);
  const ink = bg === 'ameixa' ? light : plum;
  if (kind === 'palavra') D.logo(g, w / 2, w / 2, w * .7, ink);
  else { const nh = w * .5, nw = nh * 353 / 382; D.monogram(g, w / 2 - nw / 2, w / 2 - nh / 2, nh, ink); }
  return true;
};
</script></body></html>
