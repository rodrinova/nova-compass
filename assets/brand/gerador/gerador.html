<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script src="../nova-draw.js"></script>
<script>
// Fundos de ecrã (render) e imagens do LinkedIn (renderLI). O desenho da marca está em ../nova-draw.js.
const D = NOVA_DRAW, PAL = D.PAL;
// onde fica o logótipo em cada formato: centro (x,y) e largura, em fração
function spot(w, h, center) {
  const port = h > w * 1.2, sq = !port && h > w * 0.8;
  if (center) return port ? { x: .5, y: .5, lw: .40 } : sq ? { x: .5, y: .5, lw: .24 } : { x: .5, y: .5, lw: .15 };
  return port ? { x: .5, y: .80, lw: .22 } : sq ? { x: .5, y: .82, lw: .13 } : { x: .5, y: .84, lw: .072 };
}
const drawLogo = (g, w, h, s, color) => D.logo(g, s.x * w, s.y * h, s.lw * w, color);
function canvas(w, h) { const cv = document.getElementById('c'); cv.width = w; cv.height = h; return cv.getContext('2d'); }

window.render = (design, mode, w, h, opt = {}) => {
  const g = canvas(w, h), P = PAL[mode], port = h > w * 1.2;
  if (design === 'assinatura') {   // o fundo da marca: o NOVA ao centro, o feixe a passar pelo N
    const s = spot(w, h, true), fy = port ? .5 : .47, lw = s.lw * w * (port ? .85 : 1);
    D.background(g, design, mode, w, h, { focus: { fx: .5, fy, bx: D.nCenterX(w / 2, lw) / w, by: fy } });
    if (!opt.noLogo) D.logo(g, w / 2, h * fy, lw, P.ink);   // sem logótipo: ecrã principal do iPhone (os ícones ficam por cima)
    D.grain(g, w, h, 1.6, 7);
    return true;
  }
  if (design === 'monograma') {
    const nh = (port ? 1.05 : 1.25) * h, k = nh / 382;
    D.background(g, design, mode, w, h, { mono: { x: port ? w / 2 - 353 * k * 0.55 : w - 353 * k * 0.78, y: port ? h * 0.08 : h * 0.06, h: nh } });
  } else D.background(g, design, mode, w, h);
  if (design === 'essencial') drawLogo(g, w, h, spot(w, h, true), P.ink);
  else if (design === 'monograma') drawLogo(g, w, h, port || h > w * .8 ? spot(w, h) : { x: .12, y: .86, lw: .072 }, P.ink);
  else drawLogo(g, w, h, spot(w, h), P.ink);
  D.grain(g, w, h, design === 'luz' ? 5 : 3, { essencial: 7, monograma: 11, topografia: 13, luz: 17 }[design]);
  return true;
};

// ---------- LinkedIn ----------
// O fundo assinatura (o mesmo dos fundos de ecrã), em claro e escuro.
// kind: cover (página da empresa, 4200×700), life (separador Vida, 2256×752), personal (perfil de cada pessoa, 1584×396)
// O LinkedIn põe o logótipo da página / a fotografia de perfil por cima do canto inferior esquerdo da capa,
// e no telemóvel corta as pontas: o logótipo e a frase ficam no meio (página) ou à direita (perfil pessoal).
const TAGLINE = 'Creating Impact. Driving Returns. Building Legacy.';
window.renderLI = async (kind, design, mode, w, h) => {
  await document.fonts.load('500 40px Inter');
  const g = canvas(w, h), P = PAL[mode];
  // Regras do logótipo: largura fixa por formato; a frase numa linha própria a 8 % da largura do NOVA
  // (legível no tamanho a que o LinkedIn mostra a capa, ~1128 px no computador), a 0,9× esse tamanho por baixo.
  const personal = kind === 'personal';
  const cx = personal ? w * .72 : w * .5;
  const lw = personal ? w * .2 : kind === 'life' ? w * .19 : w * .15;
  const lh = lw * D.LH / D.LW, fs = Math.round(lw * (personal ? .072 : .08)), gap = fs * .9;
  const ly = h * .5 - (fs + gap) / 2;
  D.background(g, 'assinatura', mode, w, h, { focus: { fx: cx / w, fy: ly / h, bx: D.nCenterX(cx, lw) / w, by: ly / h } });
  D.logo(g, cx, ly, lw, P.ink);
  g.font = `500 ${fs}px Inter`; g.fillStyle = P.soft; g.textAlign = 'center'; g.textBaseline = 'top';
  if ('letterSpacing' in g) g.letterSpacing = (fs * .005) + 'px';
  g.fillText(TAGLINE, cx, ly + lh / 2 + gap);
  D.grain(g, w, h, 1.6, 23);
  return true;
};
// Fundo de reunião (Teams), 1920×1080. A pessoa ocupa o centro e a parte de baixo, e o Teams corta as pontas
// em algumas grelhas: o logótipo vai para o terço de cima, à direita, dentro dos 3/4 centrais da largura.
// O fundo fica em meio-tom (nem branco puro nem preto) para o recorte da pessoa ficar limpo.
window.renderTeams = (mode, w, h) => {
  const g = canvas(w, h), P = PAL[mode];
  const cx = w * .76, cy = h * .2, lw = w * .12;
  D.background(g, 'assinatura', mode, w, h, { focus: { fx: cx / w, fy: cy / h, bx: D.nCenterX(cx, lw) / w, by: cy / h } });
  g.fillStyle = mode === 'dark' ? 'rgba(255,248,240,.045)' : 'rgba(58,42,54,.075)'; g.fillRect(0, 0, w, h);
  D.logo(g, cx, cy, lw, P.ink);
  D.grain(g, w, h, 1, 31);
  return true;
};
// Placa da assinatura de email: o logótipo no fundo escuro da marca (o texto da assinatura fica escuro, sobre o branco do email)
window.renderPlate = (w, h) => {
  const g = canvas(w, h);
  D.background(g, 'assinatura', 'dark', w, h, { focus: { fx: .5, fy: .5 } });
  D.logo(g, w / 2, h / 2, w * .56, PAL.dark.ink);
  return true;
};
// Logótipo da página (quadrado): palavra NOVA ou o N, no fundo escuro da marca ou em ameixa
window.renderLogo = (kind, bg, w) => {
  const g = canvas(w, w), plum = '#714D79', light = '#F4F3EF';
  if (bg === 'escuro') D.background(g, 'assinatura', 'dark', w, w, { focus: { fx: .5, fy: .5 } });
  else { g.fillStyle = bg === 'ameixa' ? plum : light; g.fillRect(0, 0, w, w); }
  const ink = bg === 'escuro' ? PAL.dark.ink : bg === 'ameixa' ? light : plum;
  if (kind === 'palavra') D.logo(g, w / 2, w / 2, w * .78, ink);
  else { const nh = w * .5, nw = nh * 353 / 382; D.monogram(g, w / 2 - nw / 2, w / 2 - nh / 2, nh, ink); }
  return true;
};
</script></body></html>
