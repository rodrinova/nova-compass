<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Compass v1.1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream: #E4E5DF;
    --cream-soft: #F1F2EE;
    --purple: #714D79;
    --purple-light: #A38BA8;
    --purple-glow: rgba(113, 77, 121, 0.35);
    --text-dark: #1C1A19;
    --text-muted: #766C60;
    --border: rgba(28, 26, 25, 0.09);
    --glass-bg: rgba(255, 255, 255, 0.72);
    --glass-border: rgba(255, 255, 255, 0.78);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { -webkit-font-smoothing: antialiased; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(163, 139, 168, 0.20), transparent 45%),
      radial-gradient(circle at 85% 25%, rgba(113, 77, 121, 0.16), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(241, 242, 238, 0.9), transparent 60%),
      var(--cream);
    background-attachment: fixed;
    color: var(--text-dark);
    min-height: 100vh;
    letter-spacing: -0.01em;
  }

  /* ---------- Login ---------- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--glass-bg);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border);
    padding: 40px 32px;
    border-radius: 28px;
    box-shadow:
      0 8px 32px rgba(28, 26, 25, 0.08),
      0 1px 2px rgba(28, 26, 25, 0.04),
      inset 0 1px 0 rgba(255,255,255,0.6);
  }

  .app-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(155deg, var(--purple-light), var(--purple));
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px var(--purple-glow), inset 0 1px 1px rgba(255,255,255,0.4);
  }
  .app-icon svg { width: 28px; height: 28px; }

  .brand-logo-lg {
    display: block;
    height: 34px;
    width: auto;
    margin: 0 auto 10px;
  }
  .brand-subtitle {
    text-align: center;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--purple);
    margin-bottom: 6px;
  }

  .login-card h1 {
    font-size: 24px;
    font-weight: 650;
    text-align: center;
    letter-spacing: -0.02em;
  }
  .login-card p.sub {
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
    margin-top: 4px;
    margin-bottom: 28px;
  }

  .field-group {
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 14px;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .field-group input {
    width: 100%;
    padding: 14px 16px;
    border: none;
    background: transparent;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-dark);
  }
  .field-group input:focus { outline: none; }
  .field-group input::placeholder { color: var(--text-muted); }

  .toggle-pw {
    background: none;
    border: none;
    padding: 8px 14px 8px 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    color: var(--text-muted);
  }
  .toggle-pw:active { opacity: 0.6; }
  .toggle-pw svg { width: 20px; height: 20px; display: block; }

  #login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(155deg, var(--purple-light), var(--purple));
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px var(--purple-glow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin-top: 4px;
  }
  #login-btn:active { transform: scale(0.97); box-shadow: 0 2px 8px var(--purple-glow); }
  #login-btn:disabled { opacity: 0.6; cursor: default; transform: none; }

  .login-msg {
    font-size: 13px;
    margin-top: 14px;
    text-align: center;
  }
  .login-msg.error { color: #C4453D; }

  /* ---------- App shell ---------- */
  #app-screen { display: none; min-height: 100vh; }

  .nav-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(228, 229, 223, 0.86);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-bar h1 {
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .nav-bar p.sub { color: var(--text-muted); font-size: 12px; margin-top: 1px; }

  #logout-btn {
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dark);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  #logout-btn:active { transform: scale(0.96); background: white; }

  .content-area { max-width: 1080px; margin: 0 auto; padding: 24px 28px 60px; }

  /* ---------- Welcome card ---------- */
  .welcome-card {
    background: linear-gradient(135deg, rgba(113,77,121,0.14), rgba(163,139,168,0.06));
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-radius: 24px;
    padding: 24px 26px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 4px 20px rgba(28,26,25,0.05), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .welcome-icon {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: linear-gradient(155deg, var(--purple-light), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 12px var(--purple-glow);
  }
  .welcome-icon svg { width: 26px; height: 26px; }
  .welcome-text { min-width: 0; }
  .welcome-greeting {
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .welcome-message {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  /* ---------- Home screen ---------- */
  .home-greeting {
    font-size: 24px;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
  }
  .module-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .module-tile {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 22px 18px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(28,26,25,0.05), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .module-tile:active { transform: scale(0.97); }
  .module-tile .module-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(155deg, var(--purple-light), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px var(--purple-glow);
  }
  .module-tile .module-icon svg { width: 22px; height: 22px; }
  .module-tile .module-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .module-tile .module-desc { font-size: 12px; color: var(--text-muted); margin-top: -8px; }

  /* ---------- Nav: logo / voltar à Home ---------- */
  .nav-left {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .nav-logo-icon {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: linear-gradient(155deg, var(--purple-light), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px var(--purple-glow);
    flex-shrink: 0;
  }
  .nav-logo-icon svg { width: 18px; height: 18px; }

  .nav-logo-img { height: 19px; width: auto; display: block; flex-shrink: 0; }
  .nav-divider { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
  .brand-lockup { display: flex; align-items: flex-end; gap: 5px; }
  .brand-tag {
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    line-height: 1;
    padding-bottom: 1px;
    white-space: nowrap;
  }

  /* ---------- Cards / list ---------- */
  .project-list { display: flex; flex-direction: column; gap: 12px; }

  .project-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 18px 20px;
    box-shadow: 0 4px 18px rgba(28,26,25,0.05), inset 0 1px 0 rgba(255,255,255,0.5);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 16px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .project-card:active { transform: scale(0.99); }

  .project-main { min-width: 0; }
  .project-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .project-meta {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 3px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .project-code {
    font-variant-numeric: tabular-nums;
    color: var(--purple);
    font-weight: 600;
  }

  .status-pill {
    align-self: start;
    padding: 5px 12px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(113, 77, 121, 0.12);
    color: var(--purple);
    white-space: nowrap;
  }

  .project-footer {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
  }
  .project-footer .amount {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--text-dark);
  }

  .center-msg {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 15px;
  }

  .error-box {
    color: #C4453D;
    background: rgba(196, 69, 61, 0.08);
    border: 1px solid rgba(196, 69, 61, 0.2);
    padding: 16px 18px;
    border-radius: 16px;
    font-size: 14px;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--purple);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    .nav-bar, .content-area { padding-left: 18px; padding-right: 18px; }
    .project-card { grid-template-columns: 1fr; }
    .status-pill { justify-self: start; }
    .stat-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  }

  @media (max-width: 380px) {
    .nav-bar { padding-left: 14px; padding-right: 14px; }
    .content-area { padding-left: 14px; padding-right: 14px; }
    .nav-logo-img { height: 16px; }
    .nav-bar h1 { font-size: 17px; }
    .team-card-stats { grid-template-columns: 1fr 1fr; gap: 10px; }
    .team-stat-value { font-size: 20px; }
    .home-greeting { font-size: 21px; }
    .module-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }

  /* ---------- Slide-over de detalhe ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(28, 26, 25, 0.25);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }
  #overlay.open { opacity: 1; pointer-events: auto; }

  #detail-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(560px, 100%);
    background: rgba(237, 237, 232, 0.95);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: -8px 0 40px rgba(28,26,25,0.15);
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 21;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #detail-panel.open { transform: translateX(0); }

  .detail-header {
    position: sticky;
    top: 0;
    background: rgba(237, 237, 232, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 2;
  }
  .detail-header .titles { min-width: 0; }
  .detail-header h2 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .detail-header .sub {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 2px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #close-detail {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(28,26,25,0.06);
    border: none;
    font-size: 16px;
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
    margin-left: 12px;
  }
  #close-detail:active { background: rgba(28,26,25,0.12); }

  .detail-body { padding: 20px 24px 60px; }

  .section-label {
    font-size: 12px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 24px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }

  /* Stat tiles */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat-tile {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px 12px;
    text-align: center;
  }
  .stat-tile .stat-value {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  /* Progress ring */
  .ring-row {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 16px 18px;
  }
  .ring-row .ring-text { flex: 1; }
  .ring-row .ring-title { font-size: 14px; font-weight: 600; }
  .ring-row .ring-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* Gantt */
  .gantt-wrap {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 16px 18px 18px;
  }
  .gantt-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .gantt-row:last-child { margin-bottom: 0; }
  .gantt-label {
    width: 108px;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gantt-track {
    position: relative;
    flex: 1;
    height: 20px;
    background: rgba(28,26,25,0.05);
    border-radius: 10px;
  }
  .gantt-bar {
    position: absolute;
    top: 0;
    height: 100%;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 6px;
  }
  .gantt-bar .pct {
    font-size: 9px;
    font-weight: 700;
    color: white;
  }
  .gantt-empty { font-size: 13px; color: var(--text-muted); }
  .gantt-end-date {
    position: absolute;
    top: 0;
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    padding-left: 6px;
  }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .mini-table th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    font-weight: 650;
    padding: 0 8px 8px 0;
  }
  .mini-table td { padding: 8px 8px 8px 0; border-top: 1px solid var(--border); }
  .mini-table th.col-value, .mini-table td.col-value { text-align: right; font-variant-numeric: tabular-nums; }
  .gantt-bar.break-bar {
    background: repeating-linear-gradient(45deg, rgba(184,132,42,0.55), rgba(184,132,42,0.55) 4px, rgba(184,132,42,0.25) 4px, rgba(184,132,42,0.25) 8px);
  }
  .gantt-bar.break-bar .pct { color: #6b4e18; text-transform: capitalize; }

  /* ---------- Tabela de projetos ---------- */
  .projects-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 6px 16px;
  }
  .projects-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .projects-table th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    font-weight: 650;
    padding: 12px 10px 10px;
    white-space: nowrap;
  }
  .projects-table td {
    padding: 13px 10px;
    border-top: 1px solid var(--border);
    white-space: nowrap;
  }
  .projects-table tr.project-row { cursor: pointer; }
  .projects-table tr.project-row:active { background: rgba(113,77,121,0.06); }
  .projects-table td.col-name { white-space: normal; font-weight: 600; }
  .projects-table td.col-code { color: var(--purple); font-weight: 600; }
  .projects-table th.col-value, .projects-table td.col-value {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .search-bar-wrap { margin-bottom: 14px; }
  .search-input {
    width: 100%;
    box-sizing: border-box;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 11px 16px;
    font-size: 14px;
    color: inherit;
    font-family: inherit;
  }
  .search-input:focus { outline: none; border-color: var(--purple-light); }
  .search-input::placeholder { color: var(--text-muted); }

  @media (max-width: 600px) {
    .projects-table { font-size: 12.5px; }
    .projects-table th, .projects-table td { padding: 10px 7px; }
    .projects-table .col-type { display: none; }
  }

  /* ---------- Cartão de equipa (Home) ---------- */
  .team-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 20px 22px 18px;
    margin-bottom: 16px;
    box-shadow: 0 4px 18px rgba(28,26,25,0.05), inset 0 1px 0 rgba(255,255,255,0.5);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .team-card:active { transform: scale(0.98); }
  .team-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .team-card-name {
    font-size: 12.5px;
    font-weight: 650;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .team-card-chevron { color: var(--purple); font-size: 16px; }
  .team-card-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .team-stat-value {

    async function getDisplayName() {

    async function getCurrentMember() {
      if (currentMember) return currentMember;
      if (devMode) {

      try {

    function monthRange(date = new Date()) {
      const y = date.getFullYear(), m = date.getMonth();
      const first = new Date(y, m, 1);
      const last = new Date(y, m + 1, 0);
      const fmt = d => d.toISOString().slice(0, 10);
      return { first: fmt(first), last: fmt(last), label: date.toLocaleDateString('pt-PT', { month: 'long' }) };
    }

    function fmtEURShort(n) {
      return Number(n || 0).toLocaleString('pt-PT', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' €';
    }

    async function renderTeamCard() {
      const card = document.getElementById('team-card');
      const member = await getCurrentMember();
      if (!member || !member.team_id) {
        card.style.display = 'none';
        return;
      }
      card.style.display = 'block';
      const { first, last, label } = monthRange();
      document.getElementById('team-card-name').textContent = member.team_name || 'Equipa';
      document.getElementById('team-stat-month').textContent = label;

      try {
        let invoicesTotal = 0;
        let deliveries = [];

        if (devMode) {
          invoicesTotal = MOCK_INVOICES.reduce((s, i) => s + Number(i.amount || 0), 0);
          deliveries = MOCK_STAGES
            .filter(s => s.end_date >= first && s.end_date <= last)
            .map(s => ({ name: s.stage_types?.name ?? 'Fase', date: s.end_date }));
        } else {
          const [invRes, stagesRes] = await Promise.all([
            supabase.from('invoices')
              .select('amount, issue_date, projects!inner(team_id)')
              .eq('projects.team_id', member.team_id)
              .gte('issue_date', first).lte('issue_date', last),

    async function loadTeamPlanning(teamId) {
      const ganttEl = document.getElementById('team-gantt');
      ganttEl.innerHTML = '<div class="detail-loading">A carregar...</div>';

      try {
        let stages;
        if (devMode) {
          stages = teamId === 'mock-team-alpha'
            ? MOCK_STAGES.map((s, i) => ({
                ...s,
                project_id: MOCK_PROJECTS[i % MOCK_PROJECTS.length].id,
                projects: { name: MOCK_PROJECTS[i % MOCK_PROJECTS.length].name }
              }))
            : [];
        } else {
          const res = await supabase
            .from('project_stages')
            .select('project_id, start_date, end_date, delivery_date, percentage, status, projects!inner(name, team_id)')
            .eq('projects.team_id', teamId)
            .order('start_date');
          if (res.error) throw res.error;
          stages = res.data || [];
        }

        if (!stages || stages.length === 0) {
          ganttEl.innerHTML = '<div class="gantt-empty">Esta equipa ainda não tem fases com datas registadas.</div>';
          return;
        }

        const byProject = {};
        stages.forEach(s => {
          if (!s.start_date) return;
          const key = s.project_id;
          const end = s.end_date || s.delivery_date || s.start_date;
          if (!byProject[key]) {
            byProject[key] = { name: s.projects?.name ?? 'Projeto', start: new Date(s.start_date), end: new Date(end), pcts: [] };
          } else {
            if (new Date(s.start_date) < byProject[key].start) byProject[key].start = new Date(s.start_date);
            if (new Date(end) > byProject[key].end) byProject[key].end = new Date(end);
          }
          if (s.percentage != null) byProject[key].pcts.push(Number(s.percentage));
        });

        const projectsArr = Object.values(byProject);
        if (projectsArr.length === 0) {
          ganttEl.innerHTML = '<div class="gantt-empty">Sem datas suficientes para desenhar o planeamento.</div>';
          return;
        }

        const minDate = new Date(Math.min(...projectsArr.map(p => p.start)));
        const maxDate = new Date(Math.max(...projectsArr.map(p => p.end)));
        const totalSpan = Math.max(1, maxDate - minDate);

        ganttEl.innerHTML = projectsArr.map(p => {
          const leftPct = ((p.start - minDate) / totalSpan) * 100;
          const widthPct = Math.max(2, ((p.end - p.start) / totalSpan) * 100);
          const avgPct = p.pcts.length ? Math.round(p.pcts.reduce((a, b) => a + b, 0) / p.pcts.length) : null;
          return `
            <div class="gantt-row">
              <div class="gantt-label">${p.name}</div>
              <div class="gantt-track">

    const GREETINGS = {

    function getTimePeriod() {

      if (h >= 12 && h < 19) return 'afternoon';
      if (h >= 19 && h < 23) return 'evening';
      return 'night';
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      session ? showApp() : showLogin();
    }

    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      loginMsg.textContent = '';
      loginMsg.className = 'login-msg';

      if (!email || !password) {
        loginMsg.textContent = 'Preenche email e palavra-passe.';
        loginMsg.classList.add('error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'A entrar...';

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      loginBtn.disabled = false;
      loginBtn.textContent = 'Entrar';

      if (error) {
        loginMsg.textContent = 'Login falhou: ' + error.message;
        loginMsg.classList.add('error');
        return;

    });

    [emailInput, passwordInput].forEach(el => {
      el.addEventListener('keydown', e => {

    const togglePwBtn = document.getElementById('toggle-pw');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOpenPath = `<path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>`;
    const eyeClosedPath = `<path d="M3 3L21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10.6 5.2C11.05 5.1 11.5 5 12 5C18.5 5 22 12 22 12C22 12 21.2 13.5 19.7 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.3 6.3C3.6 8.1 2 12 2 12C2 12 5.5 19 12 19C13.9 19 15.5 18.4 16.8 17.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 10.5C9.2 10.9 9 11.4 9 12C9 13.7 10.3 15 12 15C12.6 15 13.1 14.8 13.5 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`;

    togglePwBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';

      eyeIcon.innerHTML = isPassword ? eyeClosedPath : eyeOpenPath;
      togglePwBtn.setAttribute('aria-label', isPassword ? 'Ocultar palavra-passe' : 'Mostrar palavra-passe');

    document.getElementById('logout-btn').addEventListener('click', async () => {
      devMode = false;
      await supabase.auth.signOut();
      showLogin();

    document.getElementById('dev-skip-btn').addEventListener('click', () => {

      showApp();

    document.getElementById('nav-home-btn').addEventListener('click', showHome);
    document.getElementById('module-projetos').addEventListener('click', openProjectsModule);
    document.getElementById('team-card').addEventListener('click', async () => {
      const member = await getCurrentMember();
      showTeamView(member?.team_id);
    });

    let allProjectsData = [];

    function renderProjectsTable(data) {
      if (!data || data.length === 0) {
        projectsContainer.className = 'center-msg';
        projectsContainer.textContent = 'Sem projetos correspondentes.';
        return;
      }

      const rows = data.map(p => {
        const valor = fmtEUR(p.commission_value);
        return `
          <tr class="project-row" data-id="${p.id}">
            <td class="col-code">${p.code ?? '—'}</td>
            <td class="col-name">${p.name ?? 'Sem nome'}</td>
            <td class="col-area">${p.area != null ? p.area + ' m²' : '—'}</td>
            <td class="col-type">${p.project_types?.name ?? '—'}</td>
            <td class="col-value">${valor}</td>
          </tr>
        `;
      }).join('');

      projectsContainer.className = 'projects-table-wrap';
      projectsContainer.innerHTML = `
        <table class="projects-table">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nome</th>
              <th>Área</th>
              <th class="col-type">Tipo</th>
              <th class="col-value">Valor</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      document.querySelectorAll('.project-row').forEach(row => {
        row.addEventListener('click', () => openDetail(row.dataset.id));
      });
    }

    document.getElementById('projects-search').addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      if (!term) {
        renderProjectsTable(allProjectsData);
        return;
      }
      const filtered = allProjectsData.filter(p =>
        (p.name ?? '').toLowerCase().includes(term) ||
        (p.code ?? '').toLowerCase().includes(term)
      );
      renderProjectsTable(filtered);
    });

    async function loadProjects() {
      projectsContainer.className = 'center-msg';
      projectsContainer.innerHTML = '<div class="spinner"></div>A carregar projetos...';
      document.getElementById('projects-search').value = '';

      try {
        let data;
        if (devMode) {
          data = MOCK_PROJECTS;
        } else {
          const res = await supabase
            .from('projects')
            .select('id, name, code, area, commission_value, project_types(name)')
            .order('created_at', { ascending: false });
          if (res.error) throw res.error;
          data = res.data;
        }

        allProjectsData = data || [];
        renderProjectsTable(allProjectsData);
      } catch (err) {
        projectsContainer.className = 'error-box';
        projectsContainer.textContent = 'Erro ao carregar projetos: ' + err.message;
        console.error(err);
      }
    }

    // ---------- Painel de detalhe ----------
    const overlay = document.getElementById('overlay');
    const detailPanel = document.getElementById('detail-panel');
    const detailBody = document.getElementById('detail-body');

    function closeDetail() {
      overlay.classList.remove('open');
      detailPanel.classList.remove('open');
    }
    overlay.addEventListener('click', closeDetail);
    document.getElementById('close-detail').addEventListener('click', closeDetail);

    function round2(n) {
      return Math.round((Number(n) || 0) * 100) / 100;
    }
    function fmtEUR(n) {
      return n != null ? round2(n).toLocaleString('pt-PT', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €' : '—';
    }
    function fmtDateShort(d) {
      return d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit' });
    }

    async function openDetail(projectId) {
      overlay.classList.add('open');
      detailPanel.classList.add('open');
      detailBody.innerHTML = '<div class="detail-loading">A carregar...</div>';
      document.getElementById('detail-name').textContent = '—';
      document.getElementById('detail-code').textContent = '—';
      document.getElementById('detail-client').textContent = '—';

      try {
        let project, stages, invoices, timeEntries, breaks, expenses;

        if (devMode) {
          project = MOCK_PROJECTS.find(p => p.id === projectId) || MOCK_PROJECTS[0];
          stages = MOCK_STAGES;
          invoices = MOCK_INVOICES;
          timeEntries = MOCK_TIME;
          breaks = MOCK_BREAKS.filter(b => b.project_id === project.id);
          expenses = MOCK_EXPENSES;
        } else {
          const [projectRes, stagesRes, invoicesRes, timeRes, breaksRes, expensesRes] = await Promise.all([
            supabase.from('projects').select('*, clients(name), project_types(name)').eq('id', projectId).single(),
            supabase.from('project_stages').select('*, stage_types(name)').eq('project_id', projectId).order('stage_order'),
            supabase.from('invoices').select('*').eq('project_id', projectId).order('issue_date'),
            supabase.from('time_entries').select('hours, billable, stage_id, user_id').eq('project_id', projectId),
            supabase.from('project_breaks').select('*').eq('project_id', projectId).order('position_order'),
            supabase.from('expenses').select('*, expense_categories(name)').eq('project_id', projectId).order('date', { ascending: false })
          ]);

          if (projectRes.error) throw projectRes.error;
          project = projectRes.data;
          stages = stagesRes.data || [];
          invoices = invoicesRes.data || [];
          timeEntries = timeRes.data || [];
          breaks = breaksRes.data || [];
          expenses = expensesRes.data || [];

          if (project.team_id) {
            const teamRes = await supabase.from('teams').select('name').eq('id', project.team_id).maybeSingle();
            if (!teamRes.error && teamRes.data) project.teams = teamRes.data;
          }

          const userIds = [...new Set(timeEntries.map(t => t.user_id).filter(Boolean))];
          if (userIds.length > 0) {
            const membersRes = await supabase.from('team_members').select('id, name').in('id', userIds);
            const memberMap = {};
            (membersRes.data || []).forEach(m => { memberMap[m.id] = m.name; });
            timeEntries.forEach(t => { t.member_name = memberMap[t.user_id] || 'Sem nome'; });
          }
        }

        const clienteNome = project.clients?.name || project.client || 'Sem cliente';
        document.getElementById('detail-name').textContent = project.name ?? 'Sem nome';
        document.getElementById('detail-code').textContent = project.code ?? '—';
        document.getElementById('detail-client').textContent = clienteNome;

        // --- Financeiro ---
        const totalHonorarios = round2(project.commission_value ?? 0);
        const totalFaturado = round2(invoices.reduce((s, i) => s + Number(i.amount ?? 0), 0));
        const totalRecebido = round2(invoices.reduce((s, i) => s + Number(i.amount_paid ?? 0), 0));
        const totalDespesas = round2(expenses.reduce((s, e) => s + Number(e.amount ?? 0), 0));
        const margem = round2(totalFaturado - totalDespesas);
        const pctFaturado = totalHonorarios > 0 ? Math.min(100, Math.round((totalFaturado / totalHonorarios) * 100)) : 0;

        // --- Horas ---
        const horasFaturaveis = timeEntries.filter(t => t.billable).reduce((s, t) => s + Number(t.hours ?? 0), 0);
        const horasNaoFaturaveis = timeEntries.filter(t => !t.billable).reduce((s, t) => s + Number(t.hours ?? 0), 0);
        const totalHoras = horasFaturaveis + horasNaoFaturaveis;
        const pctFaturavel = totalHoras > 0 ? (horasFaturaveis / totalHoras) * 100 : 0;
        const taxaEfetiva = horasFaturaveis > 0 ? round2(totalFaturado / horasFaturaveis) : null;

        // --- Horas por fase e por pessoa ---
        const horasPorFase = {};
        timeEntries.forEach(t => {
          if (!t.stage_id) return;
          if (!horasPorFase[t.stage_id]) horasPorFase[t.stage_id] = { total: 0, porPessoa: {} };
          const h = Number(t.hours ?? 0);
          horasPorFase[t.stage_id].total += h;
          const nome = t.member_name || 'Sem nome';
          horasPorFase[t.stage_id].porPessoa[nome] = (horasPorFase[t.stage_id].porPessoa[nome] || 0) + h;
        });

        // --- Cronograma: fases e pausas intercaladas por ordem cronológica ---
        const stageDates = stages
          .filter(s => s.start_date && (s.end_date || s.delivery_date))
          .map(s => ({ start: new Date(s.start_date), end: new Date(s.end_date || s.delivery_date) }));
        const breakDates = breaks
          .filter(b => b.start_date && b.end_date)
          .map(b => ({ start: new Date(b.start_date), end: new Date(b.end_date) }));
        const allDates = stageDates.concat(breakDates);

        let ganttHtml = '<div class="gantt-empty">Sem datas suficientes para desenhar o cronograma.</div>';
        if (allDates.length > 0) {
          const minDate = new Date(Math.min(...allDates.map(d => d.start)));
          const maxDate = new Date(Math.max(...allDates.map(d => d.end)));
          const totalSpan = Math.max(1, maxDate - minDate);

          const timelineItems = [
            ...stages.map(s => ({ kind: 'stage', data: s, sortDate: s.start_date ? new Date(s.start_date) : null })),
            ...breaks.map(b => ({ kind: 'break', data: b, sortDate: b.start_date ? new Date(b.start_date) : null }))
          ].sort((a, b) => {
            if (!a.sortDate && !b.sortDate) return 0;
            if (!a.sortDate) return 1;
            if (!b.sortDate) return -1;
            return a.sortDate - b.sortDate;
          });

          ganttHtml = timelineItems.map(item => {
            if (item.kind === 'stage') {
              const s = item.data;
              if (!s.start_date) {
                return `
                  <div class="gantt-row">
                    <div class="gantt-label">${s.stage_types?.name ?? 'Fase'}</div>
                    <div class="gantt-track"></div>
                  </div>`;
              }
              const start = new Date(s.start_date);
              const end = new Date(s.end_date || s.delivery_date || s.start_date);
              const leftPct = ((start - minDate) / totalSpan) * 100;
              const widthPct = Math.max(2, ((end - start) / totalSpan) * 100);
              const color = s.status === 'completed' || s.status === 'done'
                ? '#2E7D4F'
                : s.status === 'in_progress' || s.status === 'active'
                  ? 'var(--purple)'
                  : 'rgba(113,77,121,0.35)';
              const marcaExcluida = s.excluded_from_invoicing
                ? ' <span title="Excluída da faturação" style="opacity:.45;">✕</span>'
                : '';
              const endLabelLeft = Math.min(98, leftPct + widthPct);
              return `
                <div class="gantt-row">
                  <div class="gantt-label">${s.stage_types?.name ?? 'Fase'}${marcaExcluida}</div>
                  <div class="gantt-track">
                    <div class="gantt-bar" style="left:${leftPct}%; width:${widthPct}%; background:${color};"></div>
                    <div class="gantt-end-date" style="left:${endLabelLeft}%;">${fmtDateShort(end)}</div>
                  </div>
                </div>`;
            }
            const b = item.data;
            if (!b.start_date || !b.end_date) return '';
            const start = new Date(b.start_date);
            const end = new Date(b.end_date);
            const leftPct = ((start - minDate) / totalSpan) * 100;
            const widthPct = Math.max(2, ((end - start) / totalSpan) * 100);
            return `
              <div class="gantt-row break-row">
                <div class="gantt-label">⏸ ${b.name ?? 'Pausa'}</div>
                <div class="gantt-track">
                  <div class="gantt-bar break-bar" style="left:${leftPct}%; width:${widthPct}%;">
                    <span class="pct">${b.type ?? ''}</span>
                  </div>
                </div>
              </div>`;
          }).join('');
        }

        // --- Tabela: horas por fase e por pessoa ---
        const stageNameById = {};
        stages.forEach(s => { stageNameById[s.id] = s.stage_types?.name ?? 'Fase'; });
        const horasRows = [];
        Object.entries(horasPorFase).forEach(([stageId, info]) => {
          const faseName = stageNameById[stageId] ?? 'Fase';
          Object.entries(info.porPessoa)
            .sort((a, b) => b[1] - a[1])
            .forEach(([nome, h]) => {
              horasRows.push({ faseName, nome, h, pct: info.total > 0 ? Math.round((h / info.total) * 100) : 0 });
            });
        });
        let horasTableHtml = '<div class="gantt-empty">Sem horas registadas com fase associada.</div>';
        if (horasRows.length > 0) {
          horasTableHtml = `
            <table class="mini-table">
              <thead><tr><th>Fase</th><th>Pessoa</th><th class="col-value">Horas</th><th class="col-value">Peso</th></tr></thead>
              <tbody>
                ${horasRows.map(r => `
                  <tr>
                    <td>${r.faseName}</td>
                    <td>${r.nome}</td>
                    <td class="col-value">${r.h.toFixed(1)}h</td>
                    <td class="col-value">${r.pct}%</td>
                  </tr>`).join('')}
              </tbody>
            </table>`;
        }

        // --- Faturas ---
        let invoicesHtml = '<div class="gantt-empty">Sem faturas registadas.</div>';
        if (invoices.length > 0) {
          invoicesHtml = invoices.map(inv => {
            const paid = Number(inv.amount_paid ?? 0);
            const amount = Number(inv.amount ?? 0);
            const status = paid >= amount ? 'paid' : paid > 0 ? 'partial' : 'pending';
            const statusLabel = status === 'paid' ? 'Pago' : status === 'partial' ? 'Parcial' : 'Pendente';
            return `
              <div class="invoice-row">
                <span>${inv.invoice_number ?? inv.issue_date ?? 'Fatura'}</span>
                <span class="invoice-status ${status}">${statusLabel}</span>
                <span class="amount">${fmtEUR(amount)}</span>
              </div>`;
          }).join('');
        }

        // --- Despesas ---
        let expensesHtml = '<div class="gantt-empty">Sem despesas registadas.</div>';
        if (expenses.length > 0) {
          expensesHtml = expenses.map(e => {
            const reimbursed = !!e.reimbursed;
            return `
              <div class="invoice-row">
                <span>${e.description ?? e.expense_categories?.name ?? 'Despesa'}</span>
                <span class="invoice-status ${reimbursed ? 'paid' : 'pending'}">${reimbursed ? 'Reembolsada' : 'Por reembolsar'}</span>
                <span class="amount">${fmtEUR(Number(e.amount))}</span>
              </div>`;
          }).join('');
        }

        detailBody.innerHTML = `
          <div class="section-label">Detalhes do projeto</div>
          <div class="gantt-wrap">
            <div class="invoice-row"><span>Cliente</span><span>${clienteNome}</span></div>
            <div class="invoice-row"><span>Morada</span><span>${project.address ?? '—'}</span></div>
            <div class="invoice-row"><span>Tipo</span><span>${project.project_types?.name ?? '—'}</span></div>
            <div class="invoice-row"><span>Área</span><span>${project.area != null ? project.area + ' m²' : '—'}</span></div>
            <div class="invoice-row"><span>Equipa</span><span>${project.teams?.name ?? '—'}</span></div>
            <div class="invoice-row"><span>Adjudicação</span><span>${project.awarding_date ?? '—'}</span></div>
            <div class="invoice-row"><span>Estado</span><span>${project.status ?? '—'}</span></div>
          </div>

          <div class="section-label">Financeiro</div>
          <div class="ring-row">
            <svg width="64" height="64" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="27" fill="none" stroke="rgba(28,26,25,0.08)" stroke-width="7"/>
              <circle cx="32" cy="32" r="27" fill="none" stroke="var(--purple)" stroke-width="7"
                stroke-linecap="round"
                stroke-dasharray="${2 * Math.PI * 27}"
                stroke-dashoffset="${2 * Math.PI * 27 * (1 - pctFaturado / 100)}"
                transform="rotate(-90 32 32)"/>
              <text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1A19">${pctFaturado}%</text>
            </svg>
            <div class="ring-text">
              <div class="ring-title">Faturado do total</div>
              <div class="ring-sub">${fmtEUR(totalFaturado)} de ${fmtEUR(totalHonorarios)}</div>
            </div>
          </div>
          <div class="stat-grid" style="margin-top:10px;">
            <div class="stat-tile">
              <div class="stat-value">${fmtEUR(totalHonorarios)}</div>
              <div class="stat-label">Honorários</div>
            </div>
            <div class="stat-tile">
              <div class="stat-value">${fmtEUR(totalRecebido)}</div>
              <div class="stat-label">Recebido</div>
            </div>
            <div class="stat-tile">
              <div class="stat-value">${fmtEUR(totalDespesas)}</div>
              <div class="stat-label">Despesas</div>
            </div>
          </div>
          <div class="stat-grid" style="margin-top:10px;">
            <div class="stat-tile">
              <div class="stat-value">${fmtEUR(margem)}</div>
              <div class="stat-label">Margem</div>
            </div>
            <div class="stat-tile">
              <div class="stat-value">${taxaEfetiva != null ? fmtEUR(taxaEfetiva) + '/h' : '—'}</div>
              <div class="stat-label">Taxa efetiva</div>
            </div>
            <div class="stat-tile">
              <div class="stat-value">${totalHoras.toFixed(1)}h</div>
              <div class="stat-label">Horas totais</div>
            </div>
          </div>
          <div class="gantt-wrap" style="margin-top:10px;">
            <div class="time-bar-track">
              <div class="time-bar-seg billable" style="width:${pctFaturavel}%;"></div>
              <div class="time-bar-seg nonbillable" style="width:${100 - pctFaturavel}%;"></div>
            </div>
            <div class="time-legend">
              <span><span class="dot billable"></span>Faturáveis: ${horasFaturaveis.toFixed(1)}h</span>
              <span><span class="dot nonbillable"></span>Não faturáveis: ${horasNaoFaturaveis.toFixed(1)}h</span>
            </div>
          </div>

          <div class="section-label">Cronograma</div>
          <div class="gantt-wrap">${ganttHtml}</div>

          <div class="section-label">Horas por fase e por pessoa</div>
          <div class="gantt-wrap">${horasTableHtml}</div>

          <div class="section-label">Faturas</div>
          <div class="gantt-wrap">${invoicesHtml}</div>

          <div class="section-label">Despesas</div>
          <div class="gantt-wrap">${expensesHtml}</div>
        `;
      } catch (err) {
        detailBody.innerHTML = `<div class="error-box">Erro ao carregar detalhe: ${err.message}</div>`;
        console.error(err);
      }
    }

    init();

    } catch (err) {
      showFatal('Erro fatal ao iniciar a app: ' + err.message);
    }
  </script>
</body>
</html>
